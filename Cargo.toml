[package]
name = "public-value"
version = "1.0.4"
edition = "2024"
rust-version = "1.98"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Typed, tested public-sector cost-benefit, social-value, SROI, and impact calculations."
readme = "README.md"
repository = "https://github.com/publicprojects-io/public-value-rust-crate/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
keywords = ["public-sector", "social-value", "sroi", "cost-benefit", "government"]
categories = ["science", "data-structures", "finance"]
include = [
    "src/**/*",
    "benches/**/*",
    "docs/**/*",
    "examples/**/*",
    "tests/**/*",
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "DEVELOPMENT.md",
    "FAQ.md",
    "GLOSSARY.md",
    "LICENSE-*.md",
    "README.md",
    "REFERENCES.md",
    "ROADMAP.md",
    "SECURITY.md",
    "llms.txt",
    "llms.json",
]

[dependencies]
rust_decimal = { version = "1.43.0", features = ["maths"] }
rust_decimal_macros = "1.40.0"
rusty-money = { version = "0.5.1", features = ["iso"] }

[lints.rust]
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

# cargo-mutants builds every mutant once in a throwaway copy of the tree: no debug information and no
# incremental state make each build quicker and smaller. `.cargo/mutants.toml` selects it.
[profile.mutants]
inherits = "test"
debug = "none"
incremental = false

[dev-dependencies]
criterion = "0.7.0"
proptest = "1.9.0"

[[bench]]
name = "public_api"
harness = false
